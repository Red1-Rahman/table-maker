name: Cross-browser (Firefox, WebKit)

# The suite runs the production build in the two engines that behave most unlike Chromium.
# Triggers are limited to paths that can change the web app or its tests, so documentation-only
# pushes do not spend runner minutes.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/cross-browser.yml'
      - '.github/scripts/summarize_playwright.py'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/cross-browser.yml'
      - '.github/scripts/summarize_playwright.py'
  workflow_dispatch:

# Nothing at workflow level: every job opts in to exactly what it needs.
permissions: {}

concurrency:
  group: cross-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      NODE_VERSION: '22'
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      # Pinned so the browser cache key and the pydantic install stay reproducible.
      PYDANTIC_VERSION: '2.12.4'
      PLAYWRIGHT_JSON_REPORT: playwright-report/results.json
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Read the pinned Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ env.PLAYWRIGHT_BROWSER }}

      - name: Detect a warm browser cache
        id: browser-cache
        run: |
          if [ -d "$HOME/.cache/ms-playwright" ] && [ -n "$(ls -A "$HOME/.cache/ms-playwright" 2>/dev/null)" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies for the browser
        run: npx playwright install-deps "$PLAYWRIGHT_BROWSER"

      - name: Install the browser (skipped when the cache is warm)
        if: steps.browser-cache.outputs.hit != 'true'
        run: npx playwright install "$PLAYWRIGHT_BROWSER"

      - name: Install dependencies
        run: npm ci

      - name: Build the web application once for this browser
        run: npm run build:web

      - name: Record the wall clock start
        run: echo "START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run the Playwright suite
        run: npm run test:e2e:ci

      - name: Install the summary script dependencies
        if: always()
        run: python -m pip install --disable-pip-version-check "pydantic==$PYDANTIC_VERSION" pytest

      - name: Test the summary script models
        if: always()
        run: python -m pytest .github/scripts -q

      - name: Write the browser summary
        if: always()
        run: python .github/scripts/summarize_playwright.py

      - name: Report the measured wall clock time
        if: always()
        run: |
          now=$(date +%s)
          elapsed=$(( (now - START_EPOCH) / 60 ))
          {
            echo "### Budget"
            echo ""
            echo "Wall clock for the $PLAYWRIGHT_BROWSER job: ${elapsed} min (job timeout: 15 min, two matrix jobs per run)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the HTML report and traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-${{ env.PLAYWRIGHT_BROWSER }}
          path: |
            playwright-report
            test-results/**/trace.zip
          retention-days: 7
          if-no-files-found: ignore