name: Cross-platform tests
on:
  push:
    branches: [main]
  pull_request:

# Nothing at workflow level: each job opts in to read-only repository access.
permissions: {}

concurrency:
  group: cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Vitest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Unit and component tests
        run: npm test

  # Chromium is deliberately NOT run in CI. It is the engine the app already runs on in
  # development, and the two engines that behave differently from it (Firefox and WebKit) are covered
  # by cross-browser.yml, where each matrix job installs only its own browser. Add a Chromium job here
  # only if you decide the extra runner minutes are worth it.